{% if badge %}
<a class="{{ badge_class|default:'enamad-badge' }}" referrerpolicy="origin" target="_blank" rel="noopener" href="{{ badge.profile_url }}" aria-label="مشاهده وضعیت اینماد">
  <img referrerpolicy="origin" src="{{ badge.logo_url }}" alt="" style="cursor:pointer" code="{{ badge.auth_code }}" data-img-role="logo">
</a>
{% endif %}
