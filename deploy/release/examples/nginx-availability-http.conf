# Review only. Declare inside http, then add this access_log directive to the
# relevant server/location alongside its existing access_log directives.
# access_log /var/log/nginx/rastisi-availability.log rastisi_availability;
# In each proxied location, preserve existing proxy_set_header directives and
# overwrite any client-supplied correlation header with Nginx's generated ID.
# proxy_set_header X-Request-ID $request_id;
# Keep local permissions and rotation consistent with the other access logs.
log_format rastisi_availability escape=json
    '{"format":"rastisi_availability_v1","at":"$time_iso8601",'
    '"status":"$status","upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time",'
    '"request_time":"$request_time","request_id":"$request_id"}';
