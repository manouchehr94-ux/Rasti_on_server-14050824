worker_processes 1;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    include /etc/nginx/availability.conf;
    resolver 127.0.0.11 valid=2s ipv6=off;
    upstream staging_apps {
        zone staging_apps 64k;
        server app-a:8000 resolve max_fails=1 fail_timeout=2s;
        server app-b:8000 resolve max_fails=1 fail_timeout=2s;
    }
    # Retry only safe reads on this staging fixture. Preserve writes for diagnosis.
    map $request_method $staging_attempts {
        GET 2;
        HEAD 2;
        default 1;
    }
    server {
        listen 8080;
        server_name localhost rastisi.localhost;
        access_log /dev/stdout rastisi_availability;
        location /static/ { alias /staging/static/; }
        location /media/ { alias /staging/public/; }
        location / {
            proxy_set_header Host rastisi.localhost;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 1s;
            proxy_read_timeout 3s;
            # Nginx retry settings take literals. Writes are handled by one hop.
            error_page 418 = @single_hop;
            if ($staging_attempts = 1) { return 418; }
            proxy_next_upstream error timeout http_502 http_504;
            proxy_next_upstream_tries 2;
            proxy_pass http://staging_apps;
        }
        location @single_hop {
            proxy_set_header Host rastisi.localhost;
            proxy_set_header X-Request-ID $request_id;
            proxy_next_upstream off;
            proxy_pass http://staging_apps;
        }
    }
}
