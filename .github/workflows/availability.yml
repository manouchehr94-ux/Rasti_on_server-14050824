name: External availability
on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
  pull_request:
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: external-availability-${{ github.event_name == 'pull_request' && 'drill' || 'live' }}
  cancel-in-progress: false
jobs:
  probe:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.RASTISI_AVAILABILITY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RASTISI_PUBLIC_URL: ${{ vars.PRODUCTION_URL }}
      RASTISI_TENANT_URL: ${{ vars.RASTISI_TENANT_URL }}
      RASTISI_HEALTHCHECKS_HEARTBEAT: ${{ secrets.RASTISI_HEALTHCHECKS_HEARTBEAT }}
      RASTISI_HEALTHCHECKS_WEBSITE: ${{ secrets.RASTISI_HEALTHCHECKS_WEBSITE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 deploy/release/availability_probe.py --healthchecks
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: availability
          path: availability.jsonl
          retention-days: 14
  drill:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.number == 17 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/p0-production-availability-20261119' &&
      github.event.label.name == 'healthchecks-drill' &&
      vars.RASTISI_HEALTHCHECKS_DRILL_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    environment: healthchecks-drill
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: python3 deploy/release/availability_probe.py --healthchecks-drill
        env:
          RASTISI_HEALTHCHECKS_HEARTBEAT: ${{ secrets.RASTISI_HEALTHCHECKS_HEARTBEAT }}
          RASTISI_HEALTHCHECKS_WEBSITE: ${{ secrets.RASTISI_HEALTHCHECKS_WEBSITE }}
